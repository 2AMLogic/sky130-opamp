name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest
# (manifests/sky130-opamp.json) and byte-compare the fresh output against
# the committed verdict-of-record (manifests/sky130-opamp.signoff.json).
#
# A manifest citing an artifact that has since changed makes the fresh
# render differ from the committed record, and this check fails rather
# than letting the record rot: whoever changes cited evidence (or the
# manifest, or the vendored checklist doc) must regenerate the record in
# the same PR, so the drift lands in the diff for a reviewer to see.
#
# See manifests/README.md for the block-manifest convention, and
# klayout-tools docs/cli/signoff.md for the grader contract.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.5.0

      # Generic ("kind": "generic") evidence envelopes are hand-written, and
      # `klt signoff` grades their freshness against the hash the envelope
      # declares about itself -- it never re-hashes the artifact that hash
      # names (klayout-tools#2196, and #2403 for the generic-specific case:
      # the upstream fix reports `input_verified` but, by its own stated
      # invariant, still grades the item `met` either way, so no `klt`
      # version will ever fail the build on this drift). A native `klt`
      # envelope's `provenance.input.content_hash` was computed by `klt`
      # itself from the artifact at run time; a generic one's was typed by
      # hand, so only the generic kind needs this independent re-hash. This
      # step is what makes the staleness gate real for item 8 rather than
      # nominal: regenerate the cited record without updating the envelope
      # and this fails.
      - name: Re-hash every generic envelope's cited artifact
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys

          MANIFEST = "manifests/sky130-opamp.json"
          evidence = (json.load(open(MANIFEST)).get("evidence") or {})

          checked = 0
          failures = []

          for item, entry in sorted(evidence.items(), key=lambda kv: int(kv[0])):
              # An evidence entry is either a bare path string or
              # {"file": ..., "content_hash": ...}; a {"command": [...]} entry
              # has no file to open and is skipped.
              path = entry if isinstance(entry, str) else (entry or {}).get("file")
              if not path:
                  continue
              try:
                  envelope = json.load(open(path))
              except Exception as exc:  # unreadable/malformed cited evidence
                  failures.append(f"item {item}: cannot read evidence envelope {path}: {exc}")
                  continue
              if envelope.get("kind") != "generic":
                  continue

              provenance = (envelope.get("provenance") or {}).get("input") or {}
              artifact = provenance.get("path")
              declared = provenance.get("content_hash")
              if not artifact or not declared:
                  failures.append(
                      f"item {item}: generic envelope {path} must declare both "
                      "provenance.input.path and provenance.input.content_hash, so the "
                      "artifact it cites can be re-hashed here"
                  )
                  continue

              # `klt` resolves provenance.input.path relative to the envelope's
              # own directory first (then as repo-relative); match that order.
              resolved = os.path.normpath(os.path.join(os.path.dirname(path), artifact))
              if not os.path.isfile(resolved):
                  resolved = os.path.normpath(artifact)
              if not os.path.isfile(resolved):
                  failures.append(
                      f"item {item}: {path} names provenance.input.path {artifact!r}, "
                      "which resolves to no file"
                  )
                  continue

              with open(resolved, "rb") as handle:
                  actual = "sha256:" + hashlib.sha256(handle.read()).hexdigest()
              checked += 1
              if actual == declared:
                  print(f"item {item}: OK {resolved} -> {declared}")
              else:
                  failures.append(
                      f"item {item}: {resolved} hashes to {actual}, but {path} declares "
                      f"{declared} -- the cited artifact changed under its envelope"
                  )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              print("Re-hash the artifact, write the new value into BOTH the envelope's")
              print("provenance.input.content_hash and the manifest's pinned content_hash,")
              print("then regenerate manifests/sky130-opamp.signoff.json in the same PR.")
              sys.exit(1)

          print(f"Generic evidence envelopes verified against their cited artifacts: {checked}")
          PY

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-opamp.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met (T1 reached); 3 = the grader ran
          # clean but at least one item is unmet. Both are valid runs of
          # the grader against this manifest. Anything else is a hard
          # error (manifest/doc unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-opamp.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/sky130-opamp.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/sky130-opamp.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/sky130-opamp.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-opamp.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh: it matches a fresh klt signoff run."
          python3 -c "import json; d=json.load(open('manifests/sky130-opamp.signoff.json')); print('tier verdict of record:', d['tier'], '(T1 items met: %d/%d)' % (d['t1_met_count'], d['t1_item_count']))"
