name: design sources

# T1 item 1: the committed netlist design/netlist/opamp_core.spice must be
# what headless xschem produces from design/opamp_core.sch. A hand edit, or a
# schematic change committed without regenerating, fails this job.
# See design/bin/netlist_check.py for what is normalised, and
# design/bin/test_netlist_check.py for the negative controls.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with sim/gm-id-characterization/pdk.json (open_pdks_commit).
  PDK_VERSION: c6d73a35f524070e85faff4a6a9eef49553ebc2b

jobs:
  netlist-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install xschem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xschem
          xschem --version | head -1

      # xschem resolves sky130_fd_pr/*.sym from the PDK's own xschemrc, so
      # the pinned PDK is needed (only the sky130_fd_pr library).
      - name: Install pinned sky130 PDK
        run: |
          pip install volare
          volare enable --pdk sky130 --pdk-root "$HOME/.volare" \
            --include-libraries sky130_fd_pr "$PDK_VERSION"
          ls "$HOME/.volare/sky130A/libs.tech/xschem" | head

      - name: Netlist matches a fresh xschem netlist of the schematic
        run: |
          export PDK_ROOT="$HOME/.volare" PDK=sky130A
          python3 design/bin/netlist_check.py

      - name: Negative controls (the check must fail on drift)
        run: |
          export PDK_ROOT="$HOME/.volare" PDK=sky130A
          python3 design/bin/test_netlist_check.py -v
