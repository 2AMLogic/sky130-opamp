name: unit tests

# Simulator-free checks of the sim harness and the deterministic sizing
# calculation (stdlib unittest only: no ngspice, no PDK, no pip installs).
# The command list lives in exactly one place: design/bin/check_ci.py —
# this workflow calls it, so add or change a gate step there, not here.
#   - design/bin/sizing_check.py validate: the interpolation must reproduce
#     the committed gm/ID -summary.csv exactly.
#   - tests/: template placeholder rendering, PDK pin resolution, corner/CSV
#     aggregation, and shape validation of the committed sim records.
#   - layout/bin/test_*.py: tool-free layout flow tests (stage_reference,
#     compose-cell, magic-signoff); no klt, Magic or PDK. Must run from a
#     full checkout. Full layout regeneration stays out of CI.
# On pull_request the gate adds the committed-only append-only evidence
# check against the merge base. Run locally with
# `python3 design/bin/check_ci.py` (see README.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the append-only check can diff against the base
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Simulator-free CI gate (design/bin/check_ci.py)
        run: python design/bin/check_ci.py ${{ github.event_name == 'pull_request' && format('--pr-base origin/{0}', github.base_ref) || '' }}
