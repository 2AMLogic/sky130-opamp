name: unit tests

# Simulator-free checks of the sim harness and the deterministic sizing
# calculation (stdlib unittest only: no ngspice, no PDK, no pip installs).
#   - design/bin/sizing_check.py validate: the interpolation must reproduce
#     the committed gm/ID -summary.csv exactly.
#   - tests/: template placeholder rendering, PDK pin resolution, corner/CSV
#     aggregation, and shape validation of the committed sim records.
#   - layout/bin/test_*.py: tool-free layout flow tests (stage_reference,
#     compose-cell, magic-signoff); no klt, Magic or PDK. Must run from a
#     full checkout. Full layout regeneration stays out of CI.
# Run locally with `python3 design/bin/check_ci.py` (see README.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the append-only check can diff against the base
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate sizing_check against the committed gm/ID summary
        run: python design/bin/sizing_check.py validate

      - name: Validate integrator manifest against cited sources
        run: python design/bin/integrator_check.py validate

      - name: Check spec section 2 figures against committed PVT records
        run: python design/bin/spec_figures_check.py validate

      - name: Validate DUT snapshots (PVT and offset campaigns) and current-design binding of cited evidence
        run: |
          python sim/lib/dut_identity.py validate
          python sim/lib/dut_identity.py current

      - name: Compensation-passive grid legality (issue #131)
        run: python design/bin/grid_check.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run layout flow unit tests
        run: python -m unittest discover -s layout/bin -p 'test_*.py' -v

      - name: Append-only evidence check (PRs only)
        if: github.event_name == 'pull_request'
        run: python sim/lib/append_only_check.py --base "origin/${{ github.base_ref }}"
